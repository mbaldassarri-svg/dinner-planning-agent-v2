name: Dinner Planning Agent v2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Unit, Guardrail, HITL & Schema Suite
        env:
          GEMINI_API_KEY: "ci-placeholder-key"
          SESSION_DB_URL: "sqlite+aiosqlite:///./ci_sessions.db"
        run: pytest -v tests/test_agent.py
